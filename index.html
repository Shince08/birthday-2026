<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--bg:#060304;--wine:#5c1020;--wine2:#8b1a30;--gold:#c9a45c;--gold2:#e8d09a;--ink:#f1e6d3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100%;background:radial-gradient(ellipse at 12% 0%,rgba(122,38,74,.5),transparent 58%),radial-gradient(ellipse at 92% 100%,rgba(150,70,80,.32),transparent 55%),linear-gradient(180deg,#150811,#070305) fixed;color:var(--ink);
font-family:'Bodoni Moda',Georgia,serif;font-size:17px;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
.stage{width:100%;max-width:560px;padding:32px 24px;text-align:center;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.screen{display:none;width:100%;flex-direction:column;align-items:center;gap:22px}
.screen.on{display:flex;animation:in 1.1s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.script{font-family:'Great Vibes',cursive;color:var(--gold);font-size:clamp(46px,13vw,72px);line-height:1.1;margin:0}
h2{font-weight:400;font-size:clamp(24px,6.5vw,34px);margin:0;line-height:1.3;letter-spacing:.01em}
p{margin:0;line-height:1.6}
.dim{color:#b9a98f;font-style:italic}
.frame{border:1px solid var(--gold);outline:1px solid rgba(201,164,92,.35);outline-offset:6px;padding:40px 24px;width:100%}
button{font:inherit;cursor:pointer;border-radius:28px;max-width:100%;padding:12px 34px;letter-spacing:.04em;transition:transform .35s ease,background .3s}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.yes{background:linear-gradient(180deg,var(--wine2),var(--wine));color:var(--gold2);border:1px solid var(--gold)}
.yes:hover{background:var(--wine2)}
.no{background:transparent;color:#8d7f6b;border:1px solid #4a3a3a;z-index:5;transition:left .25s ease,top .25s ease,transform .3s}
.row{display:flex;gap:18px;align-items:center;justify-content:center;min-height:90px;flex-wrap:wrap}
.hint{min-height:1.5em;color:var(--gold);font-style:italic;font-size:15px}
.dots{display:flex;gap:10px}.dots i{width:7px;height:7px;border-radius:50%;border:1px solid var(--gold)}.dots i.f{background:var(--gold)}
.count{font-family:'Great Vibes',cursive;color:var(--gold2);font-size:clamp(110px,34vw,170px);line-height:1;text-shadow:0 0 40px rgba(139,26,48,.8)}
.bar{width:100%;height:16px;border:1px solid var(--gold);border-radius:99px;overflow:hidden;background:#1a0a0d}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--wine2),var(--gold))}
.fill.max{animation:glow 1s ease infinite alternate}@keyframes glow{to{filter:brightness(1.5)}}
.big{font-family:'Great Vibes',cursive;color:var(--gold2);font-size:clamp(48px,14vw,76px);line-height:1.1;min-height:1.1em;word-break:break-all}
input[type=range]{width:100%;accent-color:var(--gold);height:34px}
.stage{position:relative;z-index:1}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.hold{position:relative;width:100%;max-width:420px;height:130px;user-select:none;-webkit-user-select:none;touch-action:none}
.ln{position:absolute;top:50%;height:2px;width:0;margin-top:-1px;background:linear-gradient(90deg,transparent,var(--gold))}
.ln.l{left:30px}.ln.r{right:30px;transform:scaleX(-1);transform-origin:center}
.pt{position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold)}
.pt.l{left:16px}.pt.r{right:16px}
.lb{position:absolute;top:calc(50% + 18px);font-style:italic;color:#b9a98f;font-size:14px}
.lb.l{left:6px}.lb.r{right:6px}
.heart{position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;padding:0;border-radius:50%;font-size:40px;line-height:1;
background:radial-gradient(circle at 35% 30%,#a8334f,#5c1020);color:var(--gold2);border:1px solid var(--gold);touch-action:none;-webkit-tap-highlight-color:transparent;transition:transform .15s}
.heart.idle{animation:beat 2.2s ease infinite}
.heart.done{animation:burst .9s ease forwards}@keyframes burst{to{transform:scale(6);opacity:0}}
/* envelope */
.env{position:relative;width:min(300px,78vw);height:200px;background:var(--wine);border:1px solid var(--gold);cursor:pointer;
perspective:800px;box-shadow:0 20px 50px rgba(0,0,0,.7)}
.env:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 50%,#450a17 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 50%,#450a17 50%) right/50% 100% no-repeat}
.flap{position:absolute;left:0;top:0;width:100%;height:60%;background:#6e1426;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s ease;border-top:1px solid var(--gold)}
.seal{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8d09a,#a8812f);color:var(--wine);
display:flex;align-items:center;justify-content:center;font-size:26px;z-index:3;box-shadow:0 3px 8px rgba(0,0,0,.6);transition:opacity .4s;animation:beat 2.2s ease infinite}
@keyframes beat{50%{transform:scale(1.1)}}
.env.open .flap{transform:rotateX(180deg)}.env.open .seal{opacity:0}
/* letter */
.letter{width:100%;text-align:left;background:linear-gradient(180deg,#1a0a0d,#110608);border:1px solid var(--gold);outline:1px solid rgba(201,164,92,.3);outline-offset:6px;
padding:40px 28px;margin:12px 0 28px;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.letter .script{font-size:clamp(40px,11vw,56px);text-align:center;margin-bottom:18px}
.letter p{margin-bottom:1.1em;line-height:1.8;font-size:17px;opacity:0;animation:in 1s ease forwards}
.sig{font-family:'Great Vibes',cursive;color:var(--gold);font-size:42px;text-align:right}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.letter p{opacity:1}}
</style>
</head>
<body>
<main class="stage" id="stage"></main>
<script>
/* ======== EDIT YOUR PAGE HERE ======== */
const CONFIG = {
  name: "My love",                 // her name
  from: "Shiven",               // your name (signature)
  introLine: "Happy birthday,",
  introSub: "Before you get your present, I have a few questions.",
  introButton: "Fine, go on",
  questions: [
    { q: "Do you miss me?", yes: "Yes, I miss you so much", reply: "I miss you more.",
      no: ["Liar.", "You miss me, admit it.", "That button is lying.", "I know you miss me ♥", "Try again, my love.", "Not an option."] },
    { q: "I love you so much!!! How much do you love me?", yes: "I love you so so so so much", reply: "I love you too ♥",
      noLabel: "I don't",
      no: ["Yes you do.", "Liar.", "That button is lying.", "I know you do ♥", "Try again, my love.", "Not an option."] },
    { q: "Am I your favourite person?", yes: "Obviously", reply: "Good answer.",
      no: ["Think about that again.", "Wrong, and you know it.", "Try again.", "Not an option, my love.", "Just say yes ♥"] },
    { q: "Do you think I'm the best boyfriend ever?", yes: "The best, and it's not close", reply: "I'm so lucky to have you.",
      no: ["I'm choosing to ignore that.", "Rude.", "Bold of you to say no.", "Try again.", "That button is broken."] },
    { q: "Do you know I think about you every day?", yes: "Yes", reply: "Good. Keep knowing it.",
      no: ["You know I do.", "Every single day.", "Not an option, my love.", "Just say yes ♥", "You can't catch it."] }
  ],
  // Countdown: counts down to the day you see her, starting on the start date
  countdownStart: "2026-10-06",
  countdownEnd: "2026-12-21",
  distanceMax: 10000,              // km shown at the far end of the slider
  countdownLine: "Days until I see you",
  // Music: paste an audio file as a data: URI or leave blank for no music
  musicSrc: "",
  envelopeLine: "One last thing…",
  holdLine: "Hold the heart until we meet.",
  letter: [
    "RUBAANI, happy 19th birthday!! Ok, now we’re actually getting old. It’s already been three years of birthday messages, but this one’s a bit special.",
    "Not being able to see you for so long is by far one of the toughest things I’ve had to do. All I want to do after 8 hours of studying is go back to you, hug you, kiss you, and sleep next to you. I think about you so much every day. I’ve literally been searching “days left till 21st December” every day for the past month. I just miss you so much.",
    "Even though we’ve had to get through a good amount of challenges since we started long distance, I know that all of it will be SO worth it when we see each other in December (remember the 1-hour-long hug deal, right?). Seeing you in person (or even on video call) makes me realise how much you really mean to me. All our fights seem so pointless. I know that at the end of the day, I only care about being with you. You make me so happy. I promise that I’ll try to be a more understanding boyfriend. I’ll do everything it takes to make it work, and hopefully reach the point where you think it’s ok to get a tattoo together (Like individual, different tattoos, think about it!?).",
    "Although it may seem like we’re learning to live without each other, I want you to know how much worse off I’d be without you. You’re the reason I get through rough days at college. The few minutes that I get to talk to you gives me enough motivation to go about the rest of my day. Especially the long video calls, they’re the reason I have a smile on my face the entire day.",
    "I really wish that I could have been there with you today. Since for the next few years all birthdays will be like this, I’ll do my best to make you feel as special as possible every single time. Have the best birthday ever I love you and miss you SO SO SO SO MUCH (u didn’t click that option first try did u).  It’s ok if u didn’t I still love you SO SO SO much.",
    "Enjoy your day cutiepie 😘❤️"
  ],
  sign: "Forever yours,"
};
/* ===================================== */

const $ = document.getElementById('stage');
const el = (h) => { const d = document.createElement('div'); d.className = 'screen on'; d.innerHTML = h; $.innerHTML = ''; $.appendChild(d); return d; };
let step = 0;
const music = CONFIG.musicSrc ? Object.assign(new Audio(CONFIG.musicSrc), { loop: true }) : null;
function stopMusic(){
  if (!music) return;
  const t = setInterval(() => { music.volume = Math.max(0, music.volume - .05); if (music.volume <= 0) { music.pause(); clearInterval(t); } }, 120);
}

function intro(){
  const s = el(`<p class="dim">${CONFIG.introLine}</p><h1 class="script">${CONFIG.name}</h1><p class="dim">${CONFIG.introSub}</p><button class="yes" id="go">${CONFIG.introButton}</button>`);
  s.querySelector('#go').onclick = () => { if (music) music.play().catch(() => {}); question(0); };
}

function question(i){
  if (i >= CONFIG.questions.length) return loader();
  const Q = CONFIG.questions[i];
  const dots = CONFIG.questions.map((_, k) => `<i class="${k < i ? 'f' : ''}"></i>`).join('');
  const s = el(`<div class="dots">${dots}</div><div class="frame"><h2>${Q.q}</h2></div>
    <div class="row" id="row"><button class="yes" id="yes">${Q.yes}</button><button class="no" id="no">${Q.noLabel || "No"}</button></div><p class="hint" id="hint"></p>`);
  const yes = s.querySelector('#yes'), no = s.querySelector('#no'), hint = s.querySelector('#hint');
  let tries = 0, scale = 1;
  const dodge = (e) => {
    if (e) e.preventDefault();
    tries++;
    if (no.style.position !== 'fixed') { no.style.position = 'fixed'; }
    const w = no.offsetWidth, h = no.offsetHeight, pad = 12;
    no.style.left = pad + Math.random() * (innerWidth - w - pad * 2) + 'px';
    no.style.top = pad + Math.random() * (innerHeight - h - pad * 2) + 'px';
    no.style.transform = `scale(${Math.max(.45, 1 - tries * .08)})`;
    scale = Math.min(Q.yes.length > 12 ? 1.12 : 1.9, 1 + tries * .12);
    yes.style.transform = `scale(${scale})`;
    hint.textContent = Q.no[(tries - 1) % Q.no.length];
  };
  ['pointerenter', 'touchstart', 'mousedown', 'click', 'focus'].forEach(ev => no.addEventListener(ev, dodge, { passive: false }));
  yes.onclick = () => {
    s.innerHTML = `<h2 class="script">${Q.reply}</h2>`;
    setTimeout(() => question(i + 1), 1700);
  };
}

function loader(){
  const s = el(`<h2 id="t">Calculating how much I love you…</h2><div class="bar"><div class="fill" id="f"></div></div>
    <div class="big" id="p">0%</div><div class="row" id="r" style="min-height:70px"></div>`);
  const f = s.querySelector('#f'), p = s.querySelector('#p'), t = s.querySelector('#t'), row = s.querySelector('#r');
  let v = 0;
  const iv = setInterval(() => {
    v += v < 70 ? 2.2 : v < 95 ? .7 : .12;
    if (v >= 99) { v = 99; clearInterval(iv); stuck(); }
    f.style.width = v + '%'; p.textContent = Math.floor(v) + '%';
  }, 60);
  function stuck(){
    t.textContent = "Stuck at 99%. Do you want me to keep going?";
    row.innerHTML = '<button class="yes">Yes, don\'t stop</button>';
    row.firstChild.onclick = () => {
      row.innerHTML = ''; f.style.width = '100%'; f.classList.add('max');
      const t0 = performance.now(), D = 2400;
      (function tick(now){
        const k = Math.min(1, (now - t0) / D), n = Math.round(99 + (1e6 - 99) * Math.pow(k, 5));
        p.textContent = n.toLocaleString() + '%';
        if (k < 1) requestAnimationFrame(tick);
        else { t.textContent = "It never finishes."; setTimeout(slider, 2600); }
      })(t0);
    };
  }
}

function slider(){
  const max = CONFIG.distanceMax;
  const s = el(`<h2 id="t">How far apart are we?</h2><div class="big" id="d">0 km</div>
    <input type="range" id="r" min="0" max="${max}" value="0" aria-label="Distance">
    <p class="hint" id="h">Drag it.</p><div class="row" id="b" style="min-height:70px"></div>`);
  const r = s.querySelector('#r'), d = s.querySelector('#d'), h = s.querySelector('#h'), b = s.querySelector('#b');
  const show = () => d.textContent = Number(r.value).toLocaleString() + ' km';
  let busy = false;
  r.oninput = () => { if (!busy) show(); };
  r.onchange = () => {
    if (busy || +r.value === 0) return;
    busy = true; h.textContent = '';
    const from = +r.value, t0 = performance.now();
    (function back(now){
      const k = Math.min(1, (now - t0) / 700);
      r.value = Math.round(from * (1 - k)); show();
      if (k < 1) return requestAnimationFrame(back);
      busy = false; r.disabled = true;
      h.textContent = "That's not how it works. You're always with me.";
      b.innerHTML = '<button class="yes">Fine, you win</button>';
      b.firstChild.onclick = countdown;
    })(t0);
  };
}

function countdown(){
  const day = 864e5, d = (t) => { const [y, m, n] = t.split('-').map(Number); return new Date(y, m - 1, n).getTime(); };
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const days = Math.max(0, Math.round((d(CONFIG.countdownEnd) - Math.max(today, d(CONFIG.countdownStart))) / day));
  const s = el(`<p class="dim">${CONFIG.countdownLine}</p><div class="count">${days}</div>
    <p class="dim">${days === 0 ? "Today. Finally." : "Then it's horror movies with you in my arms."}</p><button class="yes" id="nx">Continue</button>`);
  s.querySelector('#nx').onclick = envelope;
}

function envelope(){
  const s = el(`<p class="dim">${CONFIG.envelopeLine}</p>
    <div class="hold" id="hold"><div class="ln l" id="a"></div><div class="ln r" id="b"></div><i class="pt l"></i><i class="pt r"></i>
    <span class="lb l">you</span><span class="lb r">me</span>
    <button class="heart idle" id="h" aria-label="Hold to open the letter">♥</button></div>
    <p class="hint" id="m">${CONFIG.holdLine}</p>`);
  const h = s.querySelector('#h'), A = s.querySelector('#a'), B = s.querySelector('#b'), m = s.querySelector('#m'), hold = s.querySelector('#hold');
  let prog = 0, down = false, last = 0, done = false;
  const draw = () => {
    const w = (hold.clientWidth / 2 - 46 - 30) * prog + 'px';
    A.style.width = B.style.width = w;
    h.style.transform = `scale(${1 + prog * .22})`;
    h.style.boxShadow = `0 0 ${prog * 46}px rgba(232,208,154,${prog * .8})`;
  };
  const tick = (now) => {
    const dt = Math.min(50, now - last) / 1000; last = now;
    prog = down ? Math.min(1, prog + dt / 2.6) : Math.max(0, prog - dt / 1.1);
    draw();
    if (prog >= 1 && !done) {
      done = true; h.classList.add('done'); m.textContent = "There you are.";
      if (navigator.vibrate) navigator.vibrate(60);
      return setTimeout(showLetter, 1100);
    }
    if (!done) requestAnimationFrame(tick);
  };
  const press = (e) => { if (done) return; if (e) e.preventDefault(); if (!down) { down = true; h.classList.remove('idle'); m.textContent = "Keep holding…"; last = performance.now(); requestAnimationFrame(tick); } };
  const lift = () => { if (done) return; down = false; if (prog > 0) m.textContent = "Don't let go."; };
  h.addEventListener('pointerdown', press);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => h.addEventListener(ev, lift));
  h.addEventListener('contextmenu', e => e.preventDefault());
  h.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') press(e); });
  h.addEventListener('keyup', lift);
}

function showLetter(){
  stopMusic();
  const paras = CONFIG.letter.map((t, k) => `<p style="animation-delay:${.6 + k * 1.1}s">${t}</p>`).join('');
  const s = el(`<article class="letter">${paras}
    <p class="sig" style="animation-delay:${.6 + CONFIG.letter.length * 1.1}s">${CONFIG.sign}<br>${CONFIG.from}</p></article>`);
  scrollTo(0, 0);
}
(function(){
  const cv = document.createElement('canvas'); cv.id = 'bg'; document.body.prepend(cv);
  const x = cv.getContext('2d'); let W, H, P = [];
  const size = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  size(); addEventListener('resize', size);
  for (let i = 0; i < 70; i++) P.push({ x: Math.random(), y: Math.random(), r: .4 + Math.random() * 1.5, ph: Math.random() * 6.3, sp: .4 + Math.random() * 1.2, vy: Math.random() < .35 ? .00006 + Math.random() * .00012 : 0 });
  const calm = matchMedia('(prefers-reduced-motion:reduce)').matches;
  (function frame(t){
    x.clearRect(0, 0, W, H);
    for (const p of P) {
      p.y -= p.vy; if (p.y < -.02) p.y = 1.02;
      const a = .2 + .6 * (Math.sin(t / 1000 * p.sp + p.ph) * .5 + .5);
      x.fillStyle = `rgba(232,208,154,${a})`; x.beginPath(); x.arc(p.x * W, p.y * H, p.r, 0, 6.283); x.fill();
    }
    if (!calm) requestAnimationFrame(frame);
  })(0);
})();
intro();
</script>
</body>
</html>
